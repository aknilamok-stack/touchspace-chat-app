<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <title>TouchSpace Notification</title>
    <style>
      :root {
        color-scheme: light;
        --card-width: 420px;
        --card-radius: 24px;
        --footer-radius: 16px;
        --card-bg: linear-gradient(180deg, #2994ff 0%, #2994ff 100%);
        --card-shadow: none;
        --text-primary: #ffffff;
        --text-subtle: rgba(255, 255, 255, 0.9);
        --text-meta: rgba(255, 255, 255, 0.8);
        --footer-bg: rgba(0, 0, 0, 0.1);
        --footer-border: rgba(255, 255, 255, 0.12);
        --action-hover: rgba(255, 255, 255, 0.1);
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      body {
        overflow: hidden;
      }

      .shell {
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        padding: 12px;
        display: flex;
        align-items: flex-end;
        justify-content: flex-end;
      }

      .card {
        width: min(var(--card-width), calc(100vw - 24px));
        overflow: hidden;
        border-radius: var(--card-radius);
        border: 1px solid rgba(0, 0, 0, 0.1);
        background: var(--card-bg);
        color: var(--text-primary);
        box-shadow: var(--card-shadow);
        user-select: none;
      }

      .tone-green {
        --card-bg: linear-gradient(180deg, #2994ff 0%, #2994ff 100%);
        --card-shadow: none;
        --text-primary: #ffffff;
        --text-subtle: rgba(255, 255, 255, 0.9);
        --text-meta: rgba(255, 255, 255, 0.8);
        --footer-bg: rgba(0, 0, 0, 0.1);
        --footer-border: rgba(255, 255, 255, 0.12);
        --action-hover: rgba(255, 255, 255, 0.1);
      }

      .tone-amber {
        --card-bg: linear-gradient(180deg, #fff5de 0%, #ffe8b6 100%);
        --card-shadow: none;
        --text-primary: #4f3410;
        --text-subtle: rgba(79, 52, 16, 0.9);
        --text-meta: rgba(79, 52, 16, 0.8);
        --footer-bg: rgba(255, 255, 255, 0.28);
        --footer-border: #e9d0a0;
        --action-hover: rgba(255, 255, 255, 0.45);
      }

      .tone-blue {
        --card-bg: linear-gradient(180deg, #eaf4ff 0%, #d8ebff 100%);
        --card-shadow: none;
        --text-primary: #123b63;
        --text-subtle: rgba(18, 59, 99, 0.9);
        --text-meta: rgba(18, 59, 99, 0.82);
        --footer-bg: rgba(255, 255, 255, 0.3);
        --footer-border: #c1dbf7;
        --action-hover: rgba(255, 255, 255, 0.55);
      }

      .card-button {
        border: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }

      .header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        padding: 20px 20px 16px;
      }

      .header-label {
        margin: 0;
        font-size: 15px;
        line-height: 1.2;
        font-weight: 600;
        letter-spacing: 0.01em;
      }

      .close {
        margin: -2px -2px 0 0;
        padding: 0;
        font-size: 36px;
        line-height: 1;
        opacity: 0.9;
      }

      .content {
        display: flex;
        gap: 16px;
        padding: 0 20px 20px;
      }

      .avatar {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 48px;
        height: 48px;
        border-radius: 999px;
        font-size: 20px;
        line-height: 1;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.24);
      }

      .content-body {
        min-width: 0;
        flex: 1;
      }

      .title,
      .subtitle,
      .message {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        overflow: hidden;
        word-break: break-word;
      }

      .title {
        margin: 0;
        font-size: 15px;
        line-height: 1.35;
        font-weight: 500;
        -webkit-line-clamp: 2;
      }

      .subtitle {
        margin: 4px 0 0;
        font-size: 14px;
        line-height: 1.4;
        color: var(--text-subtle);
        -webkit-line-clamp: 2;
      }

      .message {
        margin: 16px 0 0;
        font-size: 15px;
        line-height: 1.45;
        color: rgba(255, 255, 255, 0.95);
        -webkit-line-clamp: 2;
      }

      .tone-amber .message,
      .tone-blue .message {
        color: var(--text-primary);
        opacity: 0.95;
      }

      .meta {
        margin: 12px 0 0;
        font-size: 12px;
        line-height: 1.4;
        font-weight: 500;
        color: var(--text-meta);
      }

      .footer {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0;
        padding: 8px;
        border-top: 1px solid var(--footer-border);
        background: var(--footer-bg);
      }

      .action {
        padding: 12px 16px;
        border-radius: var(--footer-radius);
        font-size: 14px;
        line-height: 1.2;
        font-weight: 500;
      }

      .action:hover {
        background: var(--action-hover);
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <section class="card tone-green" id="card">
        <div class="header">
          <p class="header-label" id="header">Входящее сообщение</p>
          <button class="card-button close" id="close" aria-label="Закрыть уведомление">×</button>
        </div>

        <div class="content" id="primary-surface">
          <div class="avatar" id="avatar">💬</div>
          <div class="content-body">
            <p class="title" id="title">Новое сообщение</p>
            <p class="subtitle" id="subtitle" hidden></p>
            <p class="message" id="message">Появилось новое сообщение в TouchSpace.</p>
            <p class="meta" id="meta" hidden></p>
          </div>
        </div>

        <div class="footer">
          <button class="card-button action" id="primary">Открыть</button>
          <button class="card-button action" id="secondary">Позже</button>
        </div>
      </section>
    </div>

    <script>
      const cardElement = document.getElementById("card");
      const headerElement = document.getElementById("header");
      const titleElement = document.getElementById("title");
      const subtitleElement = document.getElementById("subtitle");
      const messageElement = document.getElementById("message");
      const metaElement = document.getElementById("meta");
      const primaryButton = document.getElementById("primary");
      const secondaryButton = document.getElementById("secondary");
      const closeButton = document.getElementById("close");
      const avatarElement = document.getElementById("avatar");
      const primarySurfaceElement = document.getElementById("primary-surface");

      let currentUrl = "";

      const toneClassNames = ["tone-green", "tone-amber", "tone-blue"];

      const resolveAvatar = (title) => {
        const normalized = String(title || "").trim();
        return normalized ? normalized.charAt(0).toUpperCase() : "💬";
      };

      const setTone = (tone) => {
        cardElement.classList.remove(...toneClassNames);
        if (tone === "amber" || tone === "blue") {
          cardElement.classList.add(`tone-${tone}`);
          return;
        }

        cardElement.classList.add("tone-green");
      };

      window.touchspaceDesktopNotification.onData((payload) => {
        headerElement.textContent = payload?.header || "Входящее сообщение";
        titleElement.textContent = payload?.title || "Новое сообщение";
        subtitleElement.textContent = payload?.subtitle || "";
        subtitleElement.hidden = !payload?.subtitle;
        messageElement.textContent =
          payload?.body || "Появилось новое сообщение в TouchSpace.";
        metaElement.textContent = payload?.metaLabel || "";
        metaElement.hidden = !payload?.metaLabel;
        primaryButton.textContent = payload?.primaryLabel || "Ответить";
        secondaryButton.textContent = payload?.secondaryLabel || "Позже";
        currentUrl = payload?.url || "";
        avatarElement.textContent = payload?.avatarEmoji || resolveAvatar(payload?.title);
        avatarElement.style.backgroundColor = payload?.avatarColor || "rgba(255, 255, 255, 0.24)";
        setTone(payload?.tone || "green");
      });

      const handlePrimary = () => {
        void window.touchspaceDesktopNotification.act("primary", currentUrl);
      };

      primarySurfaceElement.addEventListener("click", handlePrimary);
      primarySurfaceElement.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          handlePrimary();
        }
      });
      primarySurfaceElement.tabIndex = 0;
      primarySurfaceElement.setAttribute("role", "button");

      primaryButton.addEventListener("click", () => {
        void window.touchspaceDesktopNotification.act("primary", currentUrl);
      });

      secondaryButton.addEventListener("click", () => {
        void window.touchspaceDesktopNotification.act("secondary", currentUrl);
      });

      closeButton.addEventListener("click", () => {
        void window.touchspaceDesktopNotification.act("close", currentUrl);
      });
    </script>
  </body>
</html>
